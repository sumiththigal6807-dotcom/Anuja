<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buzzer Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px 32px;
    width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    color: #f1f5f9;
    font-size: 22px;
    margin-bottom: 8px;
  }
  p#status {
    color: #94a3b8;
    margin-bottom: 28px;
    font-size: 14px;
  }
  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    background: #64748b;
  }
  .status-dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-dot.off { background: #ef4444; }

  #toggleBtn {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    color: white;
    background: #334155;
    transition: all 0.2s ease;
  }
  #toggleBtn.on {
    background: radial-gradient(circle, #ef4444, #b91c1c);
    box-shadow: 0 0 30px rgba(239,68,68,0.6);
  }
  #toggleBtn.off {
    background: radial-gradient(circle, #22c55e, #15803d);
    box-shadow: 0 0 30px rgba(34,197,94,0.4);
  }
  #toggleBtn:active { transform: scale(0.96); }
  #toggleBtn:disabled { opacity: 0.6; cursor: not-allowed; }

  .footer {
    margin-top: 24px;
    font-size: 11px;
    color: #475569;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔔 Buzzer Control</h1>
  <p id="status"><span class="status-dot" id="dot"></span><span id="statusText">Checking...</span></p>

  <button id="toggleBtn" disabled>...</button>

  <div class="footer">ESP8266 · Firebase RTDB</div>
</div>

<script>
  // ---------- CONFIG ----------
  // Paste your Firebase Realtime Database URL below (no trailing slash)
  const FIREBASE_URL = "https://buzzer-c73e3-default-rtdb.asia-southeast1.firebasedatabase.app/";
  const NODE_PATH = "/buzzer.json";
  // ----------------------------

  const btn = document.getElementById("toggleBtn");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");

  let buzzerState = false;

  async function fetchState() {
    try {
      const res = await fetch(FIREBASE_URL + NODE_PATH);
      const data = await res.json();
      buzzerState = data === true;
      updateUI();
    } catch (err) {
      statusText.textContent = "Connection error";
      console.error(err);
    }
  }

  async function setState(newState) {
    btn.disabled = true;
    try {
      await fetch(FIREBASE_URL + NODE_PATH, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newState)
      });
      buzzerState = newState;
      updateUI();
    } catch (err) {
      statusText.textContent = "Failed to update";
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  }

  function updateUI() {
    if (buzzerState) {
      btn.textContent = "TURN OFF";
      btn.className = "on";
      dot.className = "status-dot on";
      statusText.textContent = "Buzzer ON";
    } else {
      btn.textContent = "TURN ON";
      btn.className = "off";
      dot.className = "status-dot off";
      statusText.textContent = "Buzzer OFF";
    }
  }

  btn.addEventListener("click", () => setState(!buzzerState));

  // Initial load + periodic refresh (in case ESP8266 or another client changes it)
  fetchState();
  setInterval(fetchState, 3000);
</script>

</body>
</html>
