<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP8266 Buzzer Monitor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .status-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        #status {
            font-size: 35px;
            font-weight: bold;
            margin: 20px;
            color: #555;
        }

        button {
            border: none;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .on-button {
            background: green;
            color: white;
        }

        .off-button {
            background: red;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .connection {
            margin-top: 25px;
            font-size: 15px;
            color: #666;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>ESP8266 Buzzer Monitor</h1>

        <div class="card">

            <div class="status-title">
                Buzzer Status
            </div>

            <div id="status">
                OFF
            </div>

            <button class="on-button" onclick="turnOn()">
                TURN ON
            </button>

            <button class="off-button" onclick="turnOff()">
                TURN OFF
            </button>

            <div class="connection">
                ESP8266: Not Connected
            </div>

        </div>

    </div>


    <script>

        function turnOn() {

            document.getElementById("status").innerText = "ON";

        }


        function turnOff() {

            document.getElementById("status").innerText = "OFF";

        }

    </script>


</body>

</html>
